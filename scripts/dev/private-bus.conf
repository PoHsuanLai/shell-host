<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- kwin-virtual.sh's private session bus, for notification-banner acceptance on a headless
     KWin: the stock session.conf with no service directories. The stock config's servicedirs
     let a `Notify` call activate whatever claims org.freedesktop.Notifications, and on this
     machine that is /usr/share/dbus-1/services/org.kde.plasma.Notifications.service, starting
     plasma's own notification daemon inside the headless session instead of leaving the call to
     fail as a test of shell-host's own banners (the same problem sill's
     dev/private-bus.conf solves for its own acceptance). Here nothing is
     activatable, so `Notify` fails with no owner rather than starting one.
     Used as dbus-daemon's config-file option (kwin-virtual.sh's `inside`). -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
