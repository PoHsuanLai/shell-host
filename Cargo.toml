[workspace]
resolver = "3"
members = ["crates/shell-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What blitz needs at the pinned rev; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.91"
repository = "https://github.com/PoHsuanLai/shell-host"
publish = false

[workspace.dependencies]
shell-host = { path = "crates/shell-host" }
# The desktop's private Wayland protocols (quire_*_v1): the client bindings and the wire vocab.
# Pinned by rev, as sill and cua pin it.
casement-protocols = { git = "https://github.com/PoHsuanLai/casement-protocols.git", rev = "5bcdb46f9a3c8a2bb4c2fbec59e4d97dc60683dc", features = ["client"] }
# Sibling repo (the palmrest socket's messages); checked out next to this one.
palmrest-protocol = { path = "../palmrest/crates/palmrest-protocol" }

# ---- BEGIN PINNED BLOCK (source of truth: quire/docs/workspace-deps.toml) ----
# Copied verbatim into [workspace.dependencies] of quire, shell-host and sill. Bumped only by a
# dedicated "toolchain bump" wave that runs every repo's gates. Versions of the render stack
# (anyrender, vello, wgpu, parley) are the ones blitz's own Cargo.lock resolves at this rev;
# taffy (git) and stylo come through the blitz crates and are never named directly.

# The portable Blitz repairs (own repo, public). Local checkouts redirect it to a sibling path through
# each workspace root's [patch] (quire/CONSUMING.md section 1); git consumers get this rev.
blitz-kit = { git = "https://github.com/PoHsuanLai/blitz-kit", rev = "009232ce6eabe768dc9dfc2b46a464acfa865c48" }

# Blitz: git main, pinned by rev (crates.io dioxus-native 0.8 alpha does not build with
# blitz 0.3.0-beta.2). The in-tree dioxus-native-dom targets dioxus 0.7.x.
# Blitz comes from our fork (github.com/PoHsuanLai/blitz, branch quire-pin) at 5c755366, quire's rev: upstream e99fbdbd plus
# bf588142 (restyles elements whose animation was cancelled mid-way) and 1b23fbd9 (attributes carry no
# namespace, so `[data-x=y]` matches). Move back
# to DioxusLabs/blitz when a toolchain-bump wave finds the fix (or its equivalent) upstream.
blitz-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "5c75536652955da94704bddee09f5928a2ca9623", default-features = false, features = ["svg", "system-fonts", "custom-widget", "accessibility"] }
blitz-paint = { git = "https://github.com/PoHsuanLai/blitz", rev = "5c75536652955da94704bddee09f5928a2ca9623", features = ["custom-widget"] }
blitz-traits = { git = "https://github.com/PoHsuanLai/blitz", rev = "5c75536652955da94704bddee09f5928a2ca9623" }
dioxus-native-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "5c75536652955da94704bddee09f5928a2ca9623", default-features = false, features = ["svg", "system-fonts", "accessibility"] }
# The portable window path for apps (winit); the shell uses shell-host instead.
dioxus-native = { git = "https://github.com/PoHsuanLai/blitz", rev = "5c75536652955da94704bddee09f5928a2ca9623", default-features = false, features = ["vello-hybrid", "svg", "system-fonts", "accessibility"] }

# Dioxus 0.7.x (renderer-free core; mailo is on 0.7.10).
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
dioxus-document = "0.7"

# Render stack, matched to blitz's lockfile at the rev above.
anyrender = "0.13"
anyrender_vello_hybrid = "0.10"
anyrender_vello_cpu = { version = "0.17", features = ["multithreading", "filters"] }
vello_hybrid = "0.1"
wgpu = "29"
wgpu_context = "0.9"
# Per-device image cache for the shared hybrid renderer (anyrender_vello_hybrid names both).
rustc-hash = "2"
vello_common = "0.1"
parley = { version = "0.11.1", default-features = false, features = ["std"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }

# Wayland client (shell-host and sill share one sctk major).
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
xkbcommon = "0.8"
raw-window-handle = "0.6"
keyboard-types = "0.7"
cursor-icon = "1"

# Common.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Safe syscalls where std has none: SOCK_SEQPACKET for the palmrest socket (shell-host
# input/palmrest.rs, palmrest), hidraw/uinput ioctls (palmrest). Already in every tree through
# wayland-backend at 1.1.x; the features are the union of both users.
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"] }
futures-timer = "3"
cssparser = "0.37"
notify = "8.2"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
dirs = "6"
toml = "1"
# SSR renders for component goldens and markup lint (dev-dependency in consumers).
dioxus-ssr = "0.7"
# Named directly for image paints in custom widgets (blitz re-exports nothing).
peniko = "0.6"
# Proc-macro crates for ds-settings-derive.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Shell-only.
upower_dbus = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793" }
logind-zbus = "5"
libpulse-binding = "2.30"
system-tray = "0.8.9"
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4"
nucleo-matcher = "0.3.1"
fend-core = "1.5.8"
clap = { version = "4", features = ["derive"] }
# latchkey lives in mailo until it is split into its own repo; cargo finds crates/latchkey itself.
latchkey = { git = "https://github.com/PoHsuanLai/mailo", rev = "43ebf45f244a23c1e79c84b5d859b6fa1ba5bc7a" }
# ---- END PINNED BLOCK ----


# `deny`, not `forbid`: exactly one module (gpu/raw_handle) may opt back in with an `allow`.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# Local development: one blitz-kit checkout (a sibling of this repo) for every workspace that
# builds it, including quire and shell-host pulled in by path. A dependency's [patch] is ignored by
# its consumers, so outside consumers of quire get the git rev above.
[patch."https://github.com/PoHsuanLai/blitz-kit"]
blitz-kit = { path = "../blitz-kit/crates/blitz-kit" }

# vello and anyrender come from our forks (github.com/PoHsuanLai/vello and /anyrender, branch
# quire-filters): the colour matrix filter, multi-threaded filter layers and CSS filter lists, so
# every CSS `filter` function paints on both backends. Move back to crates.io once upstream has
# them (blitz-kit docs/blitz-gaps.md tracks the PRs).
[patch.crates-io]
vello_common = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
vello_cpu = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
vello_hybrid = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
vello_sparse_shaders = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
glifo = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
anyrender = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
anyrender_vello_cpu = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
anyrender_vello_hybrid = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
wgpu_context = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
pixels_window_renderer = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
