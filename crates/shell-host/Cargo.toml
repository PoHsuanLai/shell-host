[package]
name = "shell-host"
description = "Blitz documents on Wayland layer-shell, xdg popups and toplevels, one GPU device for every surface."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Wayland
smithay-client-toolkit = { workspace = true }
wayland-client = { workspace = true }
wayland-backend = { workspace = true }
wayland-protocols = { workspace = true }
calloop = { workspace = true }
calloop-wayland-source = { workspace = true }
xkbcommon = { workspace = true }
raw-window-handle = { workspace = true }
keyboard-types = { workspace = true }
cursor-icon = { workspace = true }
# Documents and rendering
blitz-dom = { workspace = true }
# The pinned block enables `custom-widget` on blitz-dom but not on blitz-paint; without it
# `blitz_paint::paint_scene` never calls into a `Widget`'s `paint`/`can_create_surfaces` at
# all (see crates/shell-host/src/headless.rs doc comment and the S3 report for detail).
blitz-paint = { workspace = true, features = ["custom-widget"] }
blitz-traits = { workspace = true }
dioxus-native-dom = { workspace = true }
dioxus = { workspace = true }
dioxus-document = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_hybrid = { workspace = true }
anyrender_vello_cpu = { workspace = true }
vello_hybrid = { workspace = true }
wgpu = { workspace = true }
wgpu_context = { workspace = true }
parley = { workspace = true }
image = { workspace = true }
# Common
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Spike only (Milestone 0, throwaway).
serde_json = { workspace = true, optional = true }

[features]
# Milestone 0 spike: the throwaway `spike` module and its examples.
spike = ["dep:serde_json"]

[[example]]
name = "spike_bar"
required-features = ["spike"]

[[example]]
name = "probe_toplevel"
required-features = ["spike"]

[dev-dependencies]
# Not in the pinned dependency block, and flagged as a finding in SPIKE.md / the S3 report:
# constructing `anyrender::Paint::Resource`/`ImageBrush` for a custom `blitz_dom::Widget` (as
# `examples/spike_widget.rs`, Milestone 0 spike item (d), must) needs `peniko` named directly —
# confirmed by blitz's own `examples/wgpu_texture/Cargo.toml`, which lists it the same way.
# Pinned to the exact version already resolved transitively through anyrender/blitz-paint, so
# this changes nothing about what is actually built, only what this crate may name; a
# dev-dependency because only the example needs it, not the `headless` library code.
peniko = "=0.6.1"

[features]
default = []
# `render_png` and everything downstream of it: no window, no Wayland connection, no GPU
# surface. Off by default because it is a CI/testing path, not something a running shell
# needs linked in.
headless = []

[lints]
workspace = true

[[example]]
name = "spike_widget"
required-features = ["headless"]

[[test]]
name = "headless"
required-features = ["headless"]
