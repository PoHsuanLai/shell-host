[package]
name = "shell-host"
description = "Blitz documents on Wayland layer-shell, xdg popups and toplevels, one GPU device for every surface."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Wayland
smithay-client-toolkit = { workspace = true }
wayland-client = { workspace = true }
wayland-backend = { workspace = true }
wayland-protocols = { workspace = true }
calloop = { workspace = true }
calloop-wayland-source = { workspace = true }
xkbcommon = { workspace = true }
raw-window-handle = { workspace = true }
keyboard-types = { workspace = true }
cursor-icon = { workspace = true }
# Documents and rendering
blitz-dom = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
dioxus-native-dom = { workspace = true }
dioxus = { workspace = true }
dioxus-document = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_hybrid = { workspace = true }
anyrender_vello_cpu = { workspace = true }
vello_hybrid = { workspace = true }
wgpu = { workspace = true }
wgpu_context = { workspace = true }
parley = { workspace = true }
image = { workspace = true }
# Common
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Proposed for the pinned block (root Cargo.toml, FINDINGS.md F1): the shared image cache.
rustc-hash = { workspace = true }
vello_common = { workspace = true }
# The debug-inject JSON stats lines.
serde_json = { workspace = true, optional = true }

[features]
default = []
# `render_png` and everything downstream of it: no window, no Wayland connection, no GPU
# surface. Off by default because it is a CI/testing path, not something a running shell
# needs linked in.
headless = []
# Per-surface debug commands on stdin (`<surface> hover x y`, `stats`, `capture`), the real-API
# successor of the spike's command language. Off in a shipped shell.
debug-inject = ["dep:serde_json"]

# The acceptance probe: a plain xdg toplevel (JSON configure lines) the demo items cover.
[[example]]
name = "probe_toplevel"
required-features = ["debug-inject"]

[dev-dependencies]
# Image paints for custom widgets in the examples (in the pinned block since S3).
peniko = { workspace = true }
# The drag outcome's wire form in tests, and demo_drag's JSON lines.
serde_json = { workspace = true }

[lints]
workspace = true

[[example]]
name = "demo_bar"
required-features = ["debug-inject"]

[[example]]
name = "demo_dock"
required-features = ["debug-inject"]
# The tick mode's motion math has unit tests (FINDINGS F36).
test = true

# G7 acceptance: a `PopupSize::FitContent` popup measures its own content and re-fits when it
# grows (FINDINGS.md F37).
[[example]]
name = "demo_popup"
required-features = ["debug-inject"]

# A wallpaper-shaped Background surface whose content changes after its first frame
# (FINDINGS.md F40, sill F171/G21).
[[example]]
name = "demo_wallpaper"
required-features = ["debug-inject"]

# A client-decorated toplevel: move, resize band, maximize, configure state (FINDINGS F46-F49).
[[example]]
name = "demo_window"
required-features = ["debug-inject"]

[[example]]
name = "spike_widget"
required-features = ["headless"]

[[test]]
name = "headless"
required-features = ["headless"]
