[package]
name = "shell-host"
description = "Blitz documents on Wayland layer-shell, xdg popups and toplevels, one GPU device for every surface."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Wayland
smithay-client-toolkit = { workspace = true }
wayland-client = { workspace = true }
# Named for its `client_system` feature: `Connection::backend().display_ptr()` (gpu::raw_handle).
wayland-backend = { workspace = true }
wayland-protocols = { workspace = true }
calloop = { workspace = true }
calloop-wayland-source = { workspace = true }
raw-window-handle = { workspace = true }
keyboard-types = { workspace = true }
cursor-icon = { workspace = true }
# `quire_window_v1`'s client bindings and the wire vocab (`handlers::quire_window`).
casement-protocols = { workspace = true }
# Documents and rendering
blitz-kit = { workspace = true, features = ["adapter", "settings"] }
blitz-dom = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
dioxus-native-dom = { workspace = true }
dioxus = { workspace = true }
dioxus-document = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_hybrid = { workspace = true }
anyrender_vello_cpu = { workspace = true }
vello_hybrid = { workspace = true }
wgpu = { workspace = true }
wgpu_context = { workspace = true }
image = { workspace = true }
# Common
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# The per-device image cache (`gpu::context`).
rustc-hash = { workspace = true }
vello_common = { workspace = true }
# The debug-inject JSON stats lines.
serde_json = { workspace = true }
# The palmrest socket's messages (`input::palmrest`).
palmrest-protocol = { workspace = true }
# The overlay scroll thumb's shapes and colour (scroll::paint).
peniko = { workspace = true }
# SOCK_SEQPACKET for the palmrest socket (std has no seqpacket, and unsafe is not allowed
# here); in the pinned block since quire b45282a.
rustix = { workspace = true }
# `SO_PEERPIDFD` for the palmrest socket's peer (rustix has no safe wrapper for it).
nix = { workspace = true }

[features]
default = []
# `render_png` and everything downstream of it: no window, no Wayland connection, no GPU
# surface. Off by default because it is a CI/testing path, not something a running shell
# needs linked in.
headless = []
# Per-surface debug commands on stdin (`<surface> hover x y`, `stats`, `capture`) and
# `HostCtx::inject`. Off in a shipped shell.
debug-inject = []

# The acceptance probe: a plain xdg toplevel (JSON configure lines) the demo items cover.
[[example]]
name = "probe_toplevel"
required-features = ["debug-inject"]

[dev-dependencies]
# The drag outcome's wire form in tests, and demo_drag's JSON lines.
serde_json = { workspace = true }

[lints]
workspace = true

[[example]]
name = "demo_bar"
required-features = ["debug-inject"]

[[example]]
name = "demo_dock"
required-features = ["debug-inject"]

# A `PopupSize::FitContent` popup measures its own content and re-fits when it
# grows.
[[example]]
name = "demo_popup"
required-features = ["debug-inject"]

# A wallpaper-shaped Background surface whose content changes after its first frame.
[[example]]
name = "demo_wallpaper"
required-features = ["debug-inject"]

# A client-decorated toplevel: move, resize band, maximize, configure state.
[[example]]
name = "demo_window"
required-features = ["debug-inject"]

# The session lock's acceptance; its guard against locking a real session is table-tested in
# tests/shell_host (`guard.rs` is included there).
[[example]]
name = "demo_lock"

# The IME acceptance: a plain `<input>` on an exclusive-keyboard Overlay layer.
[[example]]
name = "demo_ime"

# The popup keyboard acceptance: a None bar and a grabbing popup that prints its keys.
[[example]]
name = "demo_popup_keys"

# The swipe acceptance: a banner whose blur and input regions follow a card as a
# drag and an exit animation transform it.
[[example]]
name = "demo_swipe"
